<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="何もない懲罰空間を歩きまわり、ぼぎだぢの世界の断片を見つけていく">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ぼぎだぢ - 懲罰空間</title>
  <link rel="stylesheet" href="./style.css?v=7">
</head>
<body>
  <header class="field-header">
    <a class="back-link" href="../index.html">← キャラクター一覧に戻る</a>
    <h1>ぼぎだぢ - 懲罰空間</h1>
    <p class="lead">矢印キー / WASDで歩きまわろう。近づくと、何もなかった場所に何かが見えてくる。</p>
  </header>

  <main class="field-wrap">
    <div class="game-frame">
      <canvas id="fieldCanvas" width="960" height="600" aria-label="懲罰空間"></canvas>

      <div id="introHint" class="intro-hint">……ここには、まだ何もない。</div>

      <div id="fragmentBox" class="fragment-box" hidden>
        <p id="fragmentTitle" class="fragment-title"></p>
        <p id="fragmentText" class="fragment-text"></p>
      </div>

      <div id="completeToast" class="complete-toast" hidden>断片が出そろった。まだ、この先がある。</div>

      <button type="button" id="galleryHint" class="fragment-box gallery-hint" hidden>
        <p class="fragment-title">書庫</p>
        <p id="galleryHintText" class="fragment-text">タップ / Enterキーで中に入る</p>
      </button>

      <div id="storyOverlay" class="story-overlay" hidden>
        <div class="story-card">
          <p id="storyTitle" class="story-title"></p>
          <p id="storyText" class="story-text"></p>
          <p class="story-hint">クリック / Enterキーで進む</p>
        </div>
      </div>

      <div id="lockOverlay" class="story-overlay lock-overlay" hidden>
        <div class="story-card lock-card">
          <p class="story-title">書庫の扉 - ナンバー錠</p>
          <p class="lock-desc">4桁の番号を合わせると開くようだ。</p>
          <input id="lockInput" class="lock-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="----">
          <p id="lockError" class="lock-error" hidden>番号が違うようだ。</p>
          <div class="lock-actions">
            <button type="button" id="lockCancel" class="lock-btn lock-btn-cancel">閉じる</button>
            <button type="button" id="lockSubmit" class="lock-btn lock-btn-submit">開ける</button>
          </div>
        </div>
      </div>

      <div id="fadeOverlay" class="fade-overlay"></div>

      <button type="button" id="fullscreenBtn" class="fullscreen-btn" aria-label="全画面表示">⛶</button>
    </div>

    <div class="field-status">
      <p id="inventoryText" class="inventory-text" hidden></p>
      <p id="progressText" class="progress-text">見つけた断片: 0 / 5</p>
    </div>
  </main>

  <div id="joystick" class="joystick" aria-hidden="true">
    <div id="joystickKnob" class="joystick-knob"></div>
  </div>

  <button type="button" id="actionBtnB" class="action-btn action-btn-b" aria-label="キャンセル">B</button>
  <button type="button" id="actionBtnA" class="action-btn action-btn-a" aria-label="決定">A</button>

  <footer class="field-footer">
    <small>© Character Project</small>
  </footer>

  <script src="./rpg.js?v=7"></script>
  <script src="./worlds.js?v=7"></script>
  <script src="./script.js?v=7"></script>
</body>
</html>
