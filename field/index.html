<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="何もない懲罰空間を歩きまわり、ぼぎだぢの世界の断片を見つけていく">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ぼぎだぢ - 懲罰空間</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="./style.css?v=130">
</head>
<body>
  <header class="field-header">
    <a class="back-link" href="../index.html">← キャラクター一覧に戻る</a>
    <h1>ぼぎだぢ - 懲罰空間</h1>
    <p class="lead">矢印キー / WASDで歩きまわろう。Cキーでステータス。近づくと、何もなかった場所に何かが見えてくる。</p>
  </header>

  <main class="field-wrap">
    <div class="game-frame">
      <canvas id="fieldCanvas" width="960" height="600" aria-label="懲罰空間"></canvas>

      <!-- エラーのときだけ使う(最初の一言はキャンバスに描く) -->
      <div id="introHint" class="intro-hint hidden"></div>

      <div id="storyOverlay" class="story-overlay" hidden>
      </div>

      <!-- ステータス画面(C キー / C ボタン)。480×300 のキャンバスに描いて、ぼかさずに 2 倍へ(マップの絵と同じドット) -->
      <div id="statusOverlay" class="status-overlay" hidden>
        <canvas id="statusCanvas" width="480" height="300" aria-label="ステータス"></canvas>
      </div>

      <div id="fadeOverlay" class="fade-overlay on"></div>

      <button type="button" id="fullscreenBtn" class="fullscreen-btn" aria-label="全画面表示"></button>
    </div>

    <div class="field-status">
      <p id="inventoryText" class="inventory-text" hidden></p>
      <p id="progressText" class="progress-text"></p>
    </div>
  </main>

  <div id="joystick" class="joystick" aria-hidden="true">
    <div id="joystickKnob" class="joystick-knob"></div>
  </div>

  <button type="button" id="actionBtnB" class="action-btn action-btn-b" aria-label="キャンセル">B</button>
  <button type="button" id="actionBtnA" class="action-btn action-btn-a" aria-label="決定">A</button>
  <button type="button" id="actionBtnC" class="action-btn action-btn-c" aria-label="ステータス">C</button>

  <footer class="field-footer">
    <small>© Character Project</small>
  </footer>

  <script src="./rpg.js?v=130"></script>
  <script src="./worlds.js?v=130"></script>
  <script src="./script.js?v=130"></script>
</body>
</html>
