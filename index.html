<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WH40K 趣味傾向診断</title><style>
:root{--bg:#070b12;--card:#111827;--gold:#f59e0b;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b1907,var(--bg) 42%);color:#f8fafc;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.head{border-bottom:1px solid #6a411f}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.2em}.safe{color:#86efac;font-size:12px}.card{background:#111827ee;border:1px solid #334155;border-radius:22px;padding:28px;margin-top:26px;box-shadow:0 20px 50px #0007}h1{font-size:21px}h2{font-size:clamp(34px,7vw,62px);line-height:1.15}p{color:var(--muted);line-height:1.8}button{border:1px solid #475569;border-radius:14px;padding:14px 17px;font-weight:800;cursor:pointer;background:#0f172a;color:#fff}.primary{background:var(--gold);border-color:var(--gold);color:#111}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice:hover,.selected{border-color:var(--gold);background:#3a260d}.progress{height:8px;background:#1e293b;border-radius:8px;overflow:hidden;margin:14px 0 24px}.progress i{display:block;height:100%;background:var(--gold)}input{width:100%;padding:14px;border-radius:12px;border:1px solid #475569;background:#020617;color:#fff;font-size:16px}.field{margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score,.tag{background:#020617;border-radius:12px;padding:11px;text-align:center}.score b{display:block;color:var(--gold);font-size:22px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #475569}canvas{width:100%;border-radius:16px}.small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.card{padding:19px}.scores{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">HOBBY PROFILE</div><h1>WH40K 趣味傾向診断</h1></div><div class="safe">サーバー保存なし</div></header><div id="app"></div></main><script>
const Q=[{"k": "likert", "axis": "世界観", "t": "新しい勢力を見ると、強さよりも、その勢力がなぜ戦うのかが気になります。"}, {"k": "likert", "axis": "収集", "t": "使う予定がなくても、手元に置きたいモデルがあります。"}, {"k": "likert", "axis": "造形", "t": "モデルを見ると、色より先に、姿勢や部品構成へ目が向きます。"}, {"k": "likert", "axis": "塗装", "t": "モデルを見ると、形より先に、配色や質感へ目が向きます。"}, {"k": "likert", "axis": "ゲーム", "t": "モデルを見ると、盤上でどのように動くかを考えます。"}, {"k": "likert", "axis": "物語", "t": "モデルを見ると、その人物の名前や過去を考えたくなります。"}, {"k": "likert", "axis": "世界観", "t": "ゲームをしなくても、歴史や勢力関係を読むだけで楽しめます。"}, {"k": "likert", "axis": "収集", "t": "同じテーマのモデルがまとまって並ぶことに魅力を感じます。"}, {"k": "likert", "axis": "造形", "t": "説明書どおりに作るより、装備やポーズを変えてみたいです。"}, {"k": "likert", "axis": "塗装", "t": "短時間でそろえるより、一体ずつ塗り方を試したいです。"}, {"k": "likert", "axis": "ゲーム", "t": "制作が完全でなくても、まず遊べる状態にして対戦したいです。"}, {"k": "likert", "axis": "物語", "t": "対戦結果を、自軍の戦歴として残したいです。"}, {"k": "likert", "axis": "世界観", "t": "多少不利でも、背景設定に納得できる編成を選びたいです。"}, {"k": "likert", "axis": "収集", "t": "不足していたモデルが加わり、部隊がそろうと満足します。"}, {"k": "likert", "axis": "造形", "t": "細かく塗るより、形やシルエットを変える工作に時間を使いたいです。"}, {"k": "likert", "axis": "塗装", "t": "新しいモデルを増やすより、筆や塗料を充実させたいです。"}, {"k": "likert", "axis": "ゲーム", "t": "単体の見た目より、実際に機能する部隊編成を重視します。"}, {"k": "likert", "axis": "物語", "t": "公式設定の余白に、自分の部隊や物語を加えたいです。"}, {"k": "choice", "id": "play", "t": "ゲームでより重視するものは？", "o": ["会話と気持ちよい進行", "勝つための研究と最適化"], "tags": ["カジュアル交流型", "競技研究型"]}, {"k": "choice", "id": "shoot", "t": "より好きな戦い方は？", "o": ["射線と距離を活かす射撃", "距離を詰めて突撃する白兵"], "tags": ["射撃志向", "白兵志向"]}, {"k": "choice", "id": "army", "t": "より魅力を感じる軍団は？", "o": ["多数の兵が盤面を埋める軍団", "少数の精鋭が役割を果たす軍団", "巨大兵器や怪物が主役の軍団"], "tags": ["物量志向", "少数精鋭志向", "巨大モデル志向"]}, {"k": "choice", "id": "buy", "t": "欲しいモデルを見つけたら？", "o": ["機会を逃さず確保する", "制作計画を確認してから決める"], "tags": ["即応調達型", "計画補給型"]}, {"k": "choice", "id": "focus", "t": "コレクションの広げ方は？", "o": ["複数の勢力へ広げる", "一つの勢力を深く育てる"], "tags": ["銀河横断収集型", "一極集中育成型"]}, {"k": "choice", "id": "pond", "t": "親と恋人と親友と、完成したばかりのミニチュアが池に落ちました。最初に誰を助けますか？", "o": ["親", "恋人", "親友", "ミニチュア"], "tags": ["血統護持", "盟約優先", "戦友救出", "聖遺物保全"]}, {"k": "choice", "id": "xeno", "t": "ゼノに対する基本方針は？", "o": ["根絶する", "利用価値がある間だけ協力する", "警戒しながら共存する", "積極的に交流する", "相手による"], "tags": ["ゼノ根絶派", "実利外交派", "限定共存派", "銀河交流派", "個別審査派"]}, {"k": "choice", "id": "social", "t": "ホビー時間の過ごし方は？", "o": ["一人で集中して没頭する", "仲間と見せ合い語り合う"], "tags": ["単独没頭型", "交流共有型"]}],A=['世界観','収集','造形','塗装','ゲーム','物語'],L=['まったく当てはまらない','あまり当てはまらない','どちらともいえない','やや当てはまる','非常に当てはまる'],K='wh40k-balanced-v1';let S={step:'intro',i:0,a:{},name:'',x:'',...load()};const app=document.querySelector('#app');function load(){try{return JSON.parse(sessionStorage.getItem(K)||'{}')}catch{return{}}}function save(){sessionStorage.setItem(K,JSON.stringify(S))}function go(x){S.step=x;save();render()}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scores(){return A.map(axis=>{let vals=Q.map((q,i)=>q.axis===axis?S.a[i]:null).filter(Number.isFinite);if(vals.length!==3)return 0;return Math.round((vals.reduce((a,b)=>a+b,0)-3)/12*100)})}function result(){let sc=scores(),o=A.map((x,i)=>[x,sc[i]]).sort((a,b)=>b[1]-a[1]);return o[0][0]+'中心型'}function tags(){return Q.map((q,i)=>q.tags&&S.a[i]?q.tags[S.a[i]-1]:null).filter(Boolean)}function answer(v){S.a[S.i]=v;S.i++;if(S.i>=Q.length)S.step='result';save();render()}
function render(){if(S.step==='intro'){app.innerHTML=`<section class="card"><div class="eyebrow">26の問いで可視化</div><h2>あなたは暗黒の遠未来を<br>どう楽しむか。</h2><p>6軸は各3問の5段階評価で独立採点します。選ばれなかった軸が0点になる方式は廃止しました。</p><button class="primary" onclick="go('profile')">診断を始める</button></section>`;return}if(S.step==='profile'){app.innerHTML=`<section class="card"><h3>画像に載せる情報</h3><div class="field">表示名<input maxlength="20" value="${esc(S.name)}" oninput="S.name=this.value;save()"></div><div class="field">Xアカウント名（任意）<input value="${esc(S.x)}" oninput="S.x=this.value;save()" placeholder="@account"></div><div class="row"><button onclick="go('intro')">戻る</button><button class="primary" onclick="go('quiz')">質問へ進む</button></div></section>`;return}if(S.step==='quiz'){let q=Q[S.i],opts=q.k==='likert'?L:q.o;app.innerHTML=`<section class="card"><div class="row"><b>QUESTION ${S.i+1} / ${Q.length}</b><span>${q.k==='likert'?'5段階':'一つ選択'}</span></div><div class="progress"><i style="width:${(S.i+1)/Q.length*100}%"></i></div><h3>${q.t}</h3>${opts.map((x,j)=>`<button class="choice ${S.a[S.i]===j+1?'selected':''}" onclick="answer(${j+1})">${j+1}　${x}</button>`).join('')}<button ${S.i?'':'disabled'} onclick="S.i=Math.max(0,S.i-1);save();render()">前へ</button></section>`;return}showResult()}
function showResult(){let sc=scores();app.innerHTML=`<div class="grid"><section class="card"><div class="eyebrow">YOUR TYPE</div><h2>${result()}</h2><canvas id="chart" width="1080" height="1080"></canvas><div class="scores">${A.map((x,i)=>`<div class="score">${x}<b>${sc[i]}</b></div>`).join('')}</div><h3>スタイル</h3><div class="tags">${tags().map(x=>`<span class="tag">${x}</span>`).join('')}</div></section><section class="card"><h3>シェア用画像</h3><canvas id="share" width="1080" height="1080"></canvas><button class="primary choice" onclick="downloadImage()">PNGを保存</button><button class="choice" onclick="resetAll()">診断データを削除</button></section></div>`;draw(document.querySelector('#chart'),false);draw(document.querySelector('#share'),true)}
function draw(c,share){let x=c.getContext('2d'),sc=scores(),cx=540,cy=440,R=250;x.fillStyle='#0b1120';x.fillRect(0,0,1080,1080);x.textAlign='center';x.fillStyle='#f59e0b';x.font='700 28px sans-serif';x.fillText('WH40K HOBBY PROFILE',540,65);x.fillStyle='#fff';x.font='900 58px sans-serif';x.fillText(result(),540,140);let pt=(i,r)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/3)*r,cy+Math.sin(-Math.PI/2+i*Math.PI/3)*r];for(let g=1;g<=5;g++){x.beginPath();A.forEach((_,i)=>{let p=pt(i,R*g/5);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.strokeStyle='#64748b88';x.stroke()}x.beginPath();sc.forEach((v,i)=>{let p=pt(i,R*v/100);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.fillStyle='#f59e0b55';x.fill();x.strokeStyle='#f59e0b';x.lineWidth=7;x.stroke();x.font='700 27px sans-serif';A.forEach((a,i)=>{let p=pt(i,R+55);x.fillStyle='#e2e8f0';x.fillText(a+' '+sc[i],p[0],p[1])});x.fillStyle='#fff';x.font='700 24px sans-serif';tags().slice(0,6).forEach((t,i)=>x.fillText(t,540,770+i*34));if(share){x.fillStyle='#cbd5e1';x.font='700 26px sans-serif';x.fillText((S.name||'名もなき趣味人')+(S.x?'  '+S.x:''),540,1010)}}function downloadImage(){let a=document.createElement('a');a.download='wh40k-hobby-profile.png';a.href=document.querySelector('#share').toDataURL('image/png');a.click()}function resetAll(){sessionStorage.removeItem(K);location.reload()}render();
</script></body></html>
