<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>惑星総督 艦隊戦・人事実装版</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>惑星総督 <small id="versionMark">v0.9.2</small></strong><div id="stats"></div><div class="speed"><button data-speed="0">停止</button><button class="active" data-speed="1">通常</button><button data-speed="4">高速</button><button data-speed="12">超高速</button></div></header>
<main><aside class="left"><h2>司令</h2><button onclick="openSaveManager()">セーブ管理</button><button onclick="buildShip('scout')">探査船を建造</button><button onclick="buildShip('battleship')">戦艦を建造</button><button onclick="buildShip('transport')">輸送船を建造</button><h2>艦隊</h2><div id="fleetList"></div><h2>人事</h2><button onclick="openRoster()">人事名簿を開く</button><button onclick="openFleetManager()">艦隊編成を開く</button><h2>外交</h2><div id="dipList"></div></aside>
<section class="map"><canvas id="map"></canvas><div class="hint">未探査惑星は所属色を表示しません。惑星または艦隊をクリックしてください。</div></section>
<aside class="right"><h2>詳細</h2><div id="detail"></div><div id="actions"></div></aside></main><footer id="notificationBar"><strong>通知</strong><div id="log"></div><button onclick="openNotificationHistory()">履歴</button><button class="danger" onclick="confirmNewGame()">新しい星域</button></footer>
<div id="dialog" class="overlay hidden"><div class="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div id="dialogButtons"></div></div></div>
<div id="battle" class="overlay hidden"><div class="battleCard"><h2 id="battleTitle"></h2><canvas id="battleCanvas" width="800" height="360"></canvas><div class="battleBars"><div>自軍 <progress id="allyHP" max="100" value="100"></progress></div><div>敵軍 <progress id="enemyHP" max="100" value="100"></progress></div></div><div id="battleLog"></div><button id="battleNext">戦闘開始</button></div></div>
<script src="game.js"></script></body></html>
