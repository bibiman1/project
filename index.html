<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WH40K 趣味傾向診断</title><style>
:root{--bg:#070b12;--card:#111827;--gold:#f59e0b;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b1907,var(--bg) 42%);color:#f8fafc;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.head{border-bottom:1px solid #6a411f}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.2em}.safe{color:#86efac;font-size:12px}.card{background:#111827ee;border:1px solid #334155;border-radius:22px;padding:28px;margin-top:26px;box-shadow:0 20px 50px #0007}h1{font-size:21px}h2{font-size:clamp(34px,7vw,62px);line-height:1.15}p{color:var(--muted);line-height:1.8}button{border:1px solid #475569;border-radius:14px;padding:14px 17px;font-weight:800;cursor:pointer;background:#0f172a;color:#fff}.primary{background:var(--gold);border-color:var(--gold);color:#111}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice:hover,.selected{border-color:var(--gold);background:#3a260d}.progress{height:8px;background:#1e293b;border-radius:8px;overflow:hidden;margin:14px 0 24px}.progress i{display:block;height:100%;background:var(--gold)}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid #475569;background:#020617;color:#fff;font-size:16px}.field{margin:18px 0}.check{display:flex;gap:10px;padding:13px;border:1px solid #475569;border-radius:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score,.tag{background:#020617;border-radius:12px;padding:11px;text-align:center}.score b{display:block;color:var(--gold);font-size:22px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #475569}.small{font-size:12px}canvas{width:100%;border-radius:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.card{padding:19px}.scores{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">HOBBY PROFILE</div><h1>WH40K 趣味傾向診断</h1></div><div class="safe">サーバー保存なし</div></header><div id="app"></div></main><script>
const Q=[{"k": "axis", "t": "まとまった自由時間ができました。最初に何をしますか。", "o": ["設定を読む", "コレクションを整理する", "組立・改造をする", "塗装する", "ゲームをする", "自軍の物語を考える"]}, {"k": "axis", "t": "ホビーの成果として、最も残したいものはどれですか。", "o": ["世界への深い理解", "まとまりのあるコレクション", "独自造形の作品", "納得できる塗装作品", "印象的なゲーム経験", "自軍の歴史や物語"]}, {"k": "axis", "t": "他人の軍団を見たとき、最初に注目するものはどれですか。", "o": ["元になった設定", "軍団全体の統一感", "改造・装備・ポーズ", "配色・陰影・質感", "編成や戦い方", "独自の設定や物語"]}, {"k": "axis", "t": "新しいモデルを選ぶ最大の理由は何ですか。", "o": ["設定上必要だから", "集めたいから", "改造素材として面白いから", "塗ってみたいから", "編成上必要だから", "物語に登場させたいから"]}, {"k": "axis", "t": "一緒に楽しむなら、どのような人を選びますか。", "o": ["設定を語れる人", "収集品を見せ合える人", "一緒に工作できる人", "一緒に塗装できる人", "ゲームができる人", "継続的な戦役を作れる人"]}, {"k": "axis", "t": "未完成のモデルが増えたら、最初に何をしますか。", "o": ["設定を調べて方針を決める", "分類・整理する", "組立を進める", "一体を塗る", "遊べる部隊を準備する", "部隊設定を作る"]}, {"k": "duel", "id": "play", "t": "ゲームでより重視するものは？", "o": ["会話と気持ちよい進行", "勝つための研究と最適化"], "tags": ["カジュアル交流型", "競技研究型"]}, {"k": "duel", "id": "shoot", "t": "より好きな戦い方は？", "o": ["射線と距離を活かす射撃", "距離を詰めて突撃する白兵"], "tags": ["射撃志向", "白兵志向"]}, {"k": "duel", "id": "army", "t": "より魅力を感じる軍団は？", "o": ["多数の兵が盤面を埋める軍団", "少数の精鋭が役割を果たす軍団"], "tags": ["物量志向", "少数精鋭志向"]}, {"k": "duel", "id": "scale", "t": "軍団の主役にしたいものは？", "o": ["小型・中型モデルの連携", "巨大兵器や怪物の存在感"], "tags": ["部隊連携型", "巨大モデル志向"]}, {"k": "duel", "id": "move", "t": "より好みの戦術は？", "o": ["移動して有利な場所を選ぶ", "攻撃を受け止めて戦線を守る"], "tags": ["高機動型", "戦線維持型"]}, {"k": "duel", "id": "storywin", "t": "対戦でより記憶に残るものは？", "o": ["作戦が成功して勝ったこと", "予想外の展開から生まれた物語"], "tags": ["勝利達成型", "ナラティブ型"]}, {"k": "duel", "id": "buy", "t": "欲しいモデルを見つけたら？", "o": ["機会を逃さず確保する", "制作計画を確認してから決める"], "tags": ["即応調達型", "計画補給型"]}, {"k": "duel", "id": "focus", "t": "コレクションの広げ方は？", "o": ["複数の勢力へ広げる", "一つの勢力を深く育てる"], "tags": ["銀河横断収集型", "一極集中育成型"]}, {"k": "duel", "id": "canon", "t": "設定や配色の扱いは？", "o": ["公式をできるだけ再現する", "公式の余白で自由に創作する"], "tags": ["正史再現型", "自由創作型"]}, {"k": "duel", "id": "finish", "t": "制作で優先するものは？", "o": ["まず遊べる状態まで完成させる", "時間をかけて技法を試す"], "tags": ["完成優先型", "技法探究型"]}, {"k": "duel", "id": "craft", "t": "手を動かすならどちらですか。", "o": ["組立・改造で形を作る", "塗装で色と質感を作る"], "tags": ["造形工作型", "塗装表現型"]}, {"k": "duel", "id": "social", "t": "ホビー時間の過ごし方は？", "o": ["一人で集中して没頭する", "仲間と見せ合い語り合う"], "tags": ["単独没頭型", "交流共有型"]}, {"k": "special", "id": "pond", "t": "親と恋人と親友と、完成したばかりのミニチュアが池に落ちました。最初に誰を助けますか？", "o": ["親", "恋人", "親友", "ミニチュア"], "tags": ["血統護持", "盟約優先", "戦友救出", "聖遺物保全"]}, {"k": "special", "id": "xeno", "t": "ゼノに対する基本方針は？", "o": ["根絶する", "利用価値がある間だけ協力する", "警戒しながら共存する", "積極的に交流する", "相手による"], "tags": ["ゼノ根絶派", "実利外交派", "限定共存派", "銀河交流派", "個別審査派"]}, {"k": "multi", "id": "activity", "t": "一緒にしたい活動を選んでください。", "o": ["設定を語る", "作品を見せ合う", "組立・改造", "塗装", "カジュアル対戦", "ナラティブ対戦", "競技練習"]}, {"k": "multi", "id": "channel", "t": "希望する交流方法を選んでください。", "o": ["まずXで交流", "オンライン中心", "対面中心", "店舗・イベント", "初対面でも可"]}, {"k": "duel", "id": "rules", "t": "ルール解釈が分かれたときは？", "o": ["相談して双方が楽しめる処理を選ぶ", "公式資料やFAQで厳密に確認する"], "tags": ["合意進行型", "厳密運用型"]}, {"k": "duel", "id": "teach", "t": "新しい仲間との関わり方は？", "o": ["教わりながら楽しみたい", "経験を共有しながら支援したい"], "tags": ["教わりたい", "支援できる"]}],A=['世界観','収集','造形','塗装','ゲーム','物語'],K='wh40k-24-v1';let S={step:'intro',i:0,a:{},name:'',x:'',matching:true,...load()};const app=document.querySelector('#app');function load(){try{return JSON.parse(sessionStorage.getItem(K)||'{}')}catch{return{}}}function save(){sessionStorage.setItem(K,JSON.stringify(S))}function go(x){S.step=x;save();render()}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scores(){
  // 強制選択を0/100で扱わず、各回答を主軸・近接軸へ配点する。
  // 未選択軸を「関心なし」と誤表示しないため、全軸25点を起点とする。
  const sc=[25,25,25,25,25,25];
  const related=[
    [[5,3],[1,1]], // 世界観 -> 物語、収集
    [[2,3],[3,2]], // 収集 -> 造形、塗装
    [[3,3],[5,2]], // 造形 -> 塗装、物語
    [[2,3],[1,2]], // 塗装 -> 造形、収集
    [[5,3],[0,2]], // ゲーム -> 物語、世界観
    [[0,3],[4,2]]  // 物語 -> 世界観、ゲーム
  ];
  for(let i=0;i<6;i++){
    const v=S.a[i];
    if(!v) continue;
    const primary=v-1;
    sc[primary]+=10;
    related[primary].forEach(([axis,point])=>sc[axis]+=point);
  }
  // 後半の回答も、関係する6軸へ小さく反映する。
  const add=(axis,point)=>{sc[A.indexOf(axis)]+=point};
  if(S.a[11]===1) add('ゲーム',4); else if(S.a[11]===2) add('物語',4);
  if(S.a[14]===1) add('世界観',3); else if(S.a[14]===2) add('物語',3);
  if(S.a[16]===1) add('造形',4); else if(S.a[16]===2) add('塗装',4);
  if(S.a[12]) add('収集',2);
  if(S.a[13]) add('収集',2);
  return sc.map(v=>Math.min(100,Math.round(v)));
}function mainType(){let sc=scores(),o=A.map((x,i)=>[x,sc[i]]).sort((a,b)=>b[1]-a[1]);return o[0][0]+'中心型'}function tags(){let out=[];Q.forEach((q,i)=>{let v=S.a[i];if(q.tags&&v)out.push(q.tags[v-1])});return out}function multis(id){let q=Q.findIndex(x=>x.id===id),v=S.a[q];return Array.isArray(v)?v:[]}function answer(v){S.a[S.i]=v;S.i++;if(S.i>=Q.length)S.step='result';save();render()}function toggle(v){let a=Array.isArray(S.a[S.i])?S.a[S.i]:[];S.a[S.i]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render()}function next(){S.i++;if(S.i>=Q.length)S.step='result';save();render()}
function render(){if(S.step==='intro'){app.innerHTML=`<section class="card"><div class="eyebrow">24の問いで可視化</div><h2>あなたは暗黒の遠未来を<br>どう楽しむか。</h2><p>ホビー傾向、ゲーム志向、購入傾向、制作姿勢、暗黒の遠未来における見解を診断します。</p><button class="primary" onclick="go('profile')">診断を始める</button></section>`;return}if(S.step==='profile'){app.innerHTML=`<section class="card"><h3>画像に載せる情報</h3><div class="field">表示名<input type="text" maxlength="20" value="${esc(S.name)}" oninput="S.name=this.value;save()"></div><div class="field">Xアカウント名（任意）<input type="text" value="${esc(S.x)}" oninput="S.x=this.value;save()" placeholder="@account"></div><label class="check"><input type="checkbox" ${S.matching?'checked':''} onchange="S.matching=this.checked;save()">同好の人を探していますと表示する</label><div class="row"><button onclick="go('intro')">戻る</button><button class="primary" onclick="go('quiz')">質問へ進む</button></div></section>`;return}if(S.step==='quiz'){let q=Q[S.i],v=S.a[S.i],multi=q.k==='multi';app.innerHTML=`<section class="card"><div class="row"><b>QUESTION ${S.i+1} / 24</b><span>${multi?'複数選択':'一つ選択'}</span></div><div class="progress"><i style="width:${(S.i+1)/24*100}%"></i></div><h3>${q.t}</h3>${q.o.map((x,j)=>{let sel=multi?Array.isArray(v)&&v.includes(j+1):v===j+1;return`<button class="choice ${sel?'selected':''}" onclick="${multi?'toggle':'answer'}(${j+1})">${x}</button>`}).join('')}<div class="row"><button ${S.i?'':'disabled'} onclick="S.i=Math.max(0,S.i-1);save();render()">前へ</button>${multi?'<button class="primary" onclick="next()">次へ</button>':''}</div></section>`;return}showResult()}
function showResult(){let sc=scores(),ts=tags(),act=multis('activity').map(v=>Q.find(x=>x.id==='activity').o[v-1]),ch=multis('channel').map(v=>Q.find(x=>x.id==='channel').o[v-1]);app.innerHTML=`<div class="grid"><section class="card"><div class="eyebrow">YOUR TYPE</div><h2>${mainType()}</h2><canvas id="chart" width="1080" height="1080"></canvas><div class="scores">${A.map((x,i)=>`<div class="score">${x}<b>${sc[i]}</b></div>`).join('')}</div><h3>スタイル</h3><div class="tags">${ts.map(x=>`<span class="tag">${x}</span>`).join('')}</div><h3>希望</h3><p>${[...act,...ch].join(' / ')}</p></section><section class="card"><h3>シェア用画像</h3><canvas id="share" width="1080" height="1080"></canvas><button class="primary choice" onclick="downloadImage()">PNGを保存</button><button class="choice" onclick="copyText()">投稿文をコピー</button><button class="choice" onclick="openX()">Xの投稿画面を開く</button><button class="choice" onclick="resetAll()">診断データを削除</button></section></div>`;draw(document.querySelector('#chart'),false);draw(document.querySelector('#share'),true)}
function draw(c,share){let x=c.getContext('2d'),sc=scores(),cx=540,cy=430,R=250;x.fillStyle='#0b1120';x.fillRect(0,0,1080,1080);x.textAlign='center';x.fillStyle='#f59e0b';x.font='700 28px sans-serif';x.fillText('WH40K HOBBY PROFILE',540,65);x.fillStyle='#fff';x.font='900 58px sans-serif';x.fillText(mainType(),540,140);let pt=(i,r)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/3)*r,cy+Math.sin(-Math.PI/2+i*Math.PI/3)*r];for(let g=1;g<=5;g++){x.beginPath();A.forEach((_,i)=>{let p=pt(i,R*g/5);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.strokeStyle='#64748b88';x.stroke()}x.beginPath();sc.forEach((v,i)=>{let p=pt(i,R*v/100);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.fillStyle='#f59e0b55';x.fill();x.strokeStyle='#f59e0b';x.lineWidth=7;x.stroke();x.font='700 27px sans-serif';A.forEach((a,i)=>{let p=pt(i,R+55);x.fillStyle='#e2e8f0';x.fillText(a+' '+sc[i],p[0],p[1])});x.fillStyle='#fff';x.font='700 24px sans-serif';tags().slice(0,6).forEach((t,i)=>x.fillText(t,540,760+i*34));if(share){x.fillStyle='#cbd5e1';x.font='700 26px sans-serif';x.fillText((S.name||'名もなき趣味人')+(S.x?'  '+S.x:''),540,985);x.fillStyle='#f59e0b';x.font='22px sans-serif';x.fillText('#WH40K趣味傾向診断'+(S.matching?'  #同好の人を探しています':''),540,1030)}}function text(){return`${S.name||'名もなき趣味人'}のWH40K趣味傾向診断は「${mainType()}」でした。\n${tags().slice(0,8).join(' / ')}\n#WH40K趣味傾向診断`}function downloadImage(){let a=document.createElement('a');a.download='wh40k-hobby-profile.png';a.href=document.querySelector('#share').toDataURL('image/png');a.click()}function copyText(){navigator.clipboard.writeText(text()).then(()=>alert('コピーしました'))}function openX(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text()),'_blank','noopener')}function resetAll(){sessionStorage.removeItem(K);location.reload()}render();
</script></body></html>
