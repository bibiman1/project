<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>惑星総督 v2.1.1</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>惑星総督 <small>v2.1.1</small></strong><div id="stats"></div><nav><button data-speed="0">停止</button><button data-speed="1" class="active">通常</button><button data-speed="4">高速</button><button data-speed="12">超高速</button></nav></header>
<main><aside><h2>司令</h2><button id="saveMenu">セーブ管理</button><button id="systemMenu">星系一覧</button><button id="facilityMenu">施設建築</button><button id="dockMenu">造船ドック</button><button id="shipStatusMenu">宇宙船ステータス</button><button data-build="scout">探査船を建造</button><button data-build="battleship">戦艦を建造</button><button data-build="transport">輸送船を建造</button><h2>艦隊</h2><div id="fleets"></div><h2>人事</h2><button id="roster">人事名簿を開く</button><h2>外交</h2><div id="diplomacy"></div></aside><section class="space"><canvas id="map"></canvas><div class="hint">星系または艦隊を選択してください。</div></section><aside class="right"><h2>詳細</h2><div id="detail"></div><div id="actions"></div></aside></main>
<footer><strong>通知</strong><div id="notice">ゲームを開始しています。</div><button id="history">履歴</button><button id="newWorld" class="danger">新しい星域</button></footer>
<div id="modal" class="overlay hidden"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalButtons"></div></div></div>
<script src="game.js"></script></body></html>
