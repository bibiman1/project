<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WH40K ホビー傾向診断</title><style>
:root{--bg:#070b12;--card:#111827;--gold:#f59e0b;--text:#f8fafc;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b1907,var(--bg) 42%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.head{border-bottom:1px solid #6a411f;padding-bottom:15px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.2em}.safe{color:#86efac;font-size:12px}.card{background:#111827ee;border:1px solid #334155;border-radius:22px;padding:28px;margin-top:26px;box-shadow:0 20px 50px #0007}h1{font-size:21px}h2{font-size:clamp(34px,7vw,62px);line-height:1.15}p{color:var(--muted);line-height:1.8}.btn,button{border:1px solid #475569;border-radius:14px;padding:14px 17px;font-weight:800;cursor:pointer;background:#0f172a;color:white}.primary{background:var(--gold);border-color:var(--gold);color:#111}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice:hover,.selected{border-color:var(--gold);background:#3a260d}.progress{height:8px;background:#1e293b;border-radius:8px;overflow:hidden;margin:14px 0 24px}.progress i{display:block;height:100%;background:var(--gold)}input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid #475569;background:#020617;color:#fff;font-size:16px}.field{margin:18px 0}.check{display:flex;gap:10px;padding:13px;border:1px solid #475569;border-radius:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score,.tag{background:#020617;border-radius:12px;padding:11px;text-align:center}.score b{display:block;color:var(--gold);font-size:22px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #475569}.section{margin-top:24px;padding-top:18px;border-top:1px solid #334155}canvas{width:100%;display:block;border-radius:16px}.small{font-size:12px}.error{color:#fca5a5}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:19px}.scores{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">HOBBY PROFILE</div><h1>WH40K 趣味傾向診断</h1></div><div class="safe">サーバー保存なし</div></header><div id="app"></div></main><script>
const Q=[{"kind": "likert", "group": "basic", "axis": "世界観", "text": "新しい勢力を見ると、強さやルールよりも、何を目的に戦っているのかが気になります。"}, {"kind": "likert", "group": "basic", "axis": "造形", "text": "モデルを見ると、色より先に、姿勢、装備、部品の組み合わせへ目が向きます。"}, {"kind": "likert", "group": "basic", "axis": "収集", "text": "制作やゲームで使う予定がなくても、手元に置きたいモデルがあります。"}, {"kind": "likert", "group": "basic", "axis": "塗装", "text": "短時間で軍団をそろえるより、一体ずつ塗り方を試しながら仕上げたいです。"}, {"kind": "likert", "group": "basic", "axis": "ゲーム", "text": "モデルを見ると、その見た目や設定だけでなく、盤上でどのように動くかを考えます。"}, {"kind": "likert", "group": "basic", "axis": "物語", "text": "公式設定を知るだけでなく、その世界の中に自分の部隊や人物を置いて考えたいです。"}, {"kind": "likert", "group": "basic", "axis": "世界観", "text": "自由時間があれば、モデルを作る前に、関連する人物や戦争について読みたいです。"}, {"kind": "likert", "group": "basic", "axis": "造形", "text": "説明書どおりに早く完成させるより、部品を選び直しながら形を考えたいです。"}, {"kind": "likert", "group": "basic", "axis": "収集", "text": "一体ごとの完成度だけでなく、同じテーマのモデルがまとまって並ぶことに魅力を感じます。"}, {"kind": "likert", "group": "basic", "axis": "塗装", "text": "モデルを見ると、形より先に、配色、陰影、質感の表現へ目が向きます。"}, {"kind": "likert", "group": "basic", "axis": "ゲーム", "text": "制作が完全に終わるのを待つより、まず遊べる状態にしてゲームを経験したいです。"}, {"kind": "likert", "group": "basic", "axis": "物語", "text": "完成したモデルを見ると、その人物の名前、役割、過去を考えたくなります。"}, {"kind": "likert", "group": "basic", "axis": "世界観", "text": "ゲームをしなくても、年表、勢力関係、戦争の経緯を知るだけで楽しめます。"}, {"kind": "likert", "group": "basic", "axis": "造形", "text": "説明書どおりではない、自分だけの指揮官や兵士を作りたいです。"}, {"kind": "likert", "group": "basic", "axis": "収集", "text": "不足していたモデルが加わり、部隊やシリーズがそろったときに満足します。"}, {"kind": "likert", "group": "basic", "axis": "塗装", "text": "頭の中で考えた色や質感を、実際のモデル上に再現できたときに満足します。"}, {"kind": "likert", "group": "basic", "axis": "ゲーム", "text": "自分で考えた編成や判断が、実際のゲーム結果につながることに魅力を感じます。"}, {"kind": "likert", "group": "basic", "axis": "物語", "text": "予定どおりの勝利より、予想外の出来事から印象的な展開が生まれた方が記憶に残ります。"}, {"kind": "likert", "group": "basic", "axis": "世界観", "text": "ゲーム上は不利でも、背景設定に納得できる部隊編成を選びたいです。"}, {"kind": "likert", "group": "basic", "axis": "造形", "text": "同じ時間を使うなら、細かく塗り込むより、形やシルエットを変える工作を選びたいです。"}, {"kind": "likert", "group": "basic", "axis": "収集", "text": "限られた購入機会では、塗料や工具よりも、欲しいモデルの確保を優先したいです。"}, {"kind": "likert", "group": "basic", "axis": "塗装", "text": "限られた購入機会では、別のモデルを増やすより、筆や塗料を充実させたいです。"}, {"kind": "likert", "group": "basic", "axis": "ゲーム", "text": "単体で気に入ったモデルより、実際にゲームで使える部隊編成を優先したいです。"}, {"kind": "likert", "group": "basic", "axis": "物語", "text": "公式設定をそのまま再現するだけでなく、矛盾しない範囲で自分の物語を広げたいです。"}, {"kind": "forced", "group": "basic", "text": "まとまった自由時間ができました。最初に何をしますか。", "options": ["勢力や人物の設定を読む", "欲しいモデルを探す、またはコレクションを整理する", "モデルを組み立てる、または改造する", "モデルを塗る", "ゲームをする", "自軍の設定や戦歴を考える"]}, {"kind": "forced", "group": "basic", "text": "ホビーの成果として、最も残したいものはどれですか。", "options": ["WH40K世界への深い理解", "まとまりのあるコレクション", "独自造形のモデルや情景", "納得できる塗装作品", "印象的なゲーム経験", "自軍の歴史や物語"]}, {"kind": "forced", "group": "basic", "text": "他人の軍団を見たとき、最初に注目するものはどれですか。", "options": ["元になった公式設定", "コレクション全体の規模や統一感", "改造、装備、ポーズ", "配色、陰影、質感", "編成や盤上での使い方", "部隊独自の設定や物語"]}, {"kind": "forced", "group": "basic", "text": "新しいモデルを選ぶ最大の理由は何ですか。", "options": ["設定上、自軍に必要だから", "コレクションへ加えたいから", "改造素材として面白いから", "塗ってみたいから", "編成上必要だから", "自軍の物語に登場させたいから"]}, {"kind": "forced", "group": "basic", "text": "一緒にWH40Kを楽しむなら、どのような人を選びますか。", "options": ["設定を深く語れる人", "コレクションを見せ合える人", "一緒に組み立てや改造ができる人", "一緒に塗装できる人", "ゲームができる人", "継続的な物語や戦役を作れる人"]}, {"kind": "forced", "group": "basic", "text": "未完成のモデルが増えてきました。最初に何をしますか。", "options": ["関連設定を調べて制作方針を決める", "コレクションとして分類・整理する", "まず組み立てを完了する", "一体を選んで塗装する", "遊べる部隊だけ準備してゲームをする", "部隊ごとの設定を作る"]}, {"kind": "likert", "group": "detail", "axis": "カジュアル", "text": "勝敗よりも、相手と気持ちよく最後まで遊べることを重視します。"}, {"kind": "likert", "group": "detail", "axis": "カジュアル", "text": "ゲーム中の会話や印象的な出来事も、勝敗と同じくらい大切です。"}, {"kind": "likert", "group": "detail", "axis": "研究", "text": "ゲーム後は、勝敗を分けた配置、判断、編成を詳しく分析したいです。"}, {"kind": "likert", "group": "detail", "axis": "競技", "text": "自分の部隊を、より安定して勝てる構成へ継続的に調整したいです。"}, {"kind": "likert", "group": "detail", "axis": "競技", "text": "大会形式や順位が付く環境で、自分の実力を試してみたいです。"}, {"kind": "likert", "group": "detail", "axis": "ナラティブ", "text": "勝率が下がっても、自軍の設定やテーマに合った編成を使いたいです。"}, {"kind": "likert", "group": "detail", "axis": "ナラティブ", "text": "勝敗そのものより、戦いの結果が自軍の物語として残ることに魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "調整", "text": "対戦相手と事前にゲームの温度感や使用する編成について話し合いたいです。"}, {"kind": "likert", "group": "detail", "axis": "公式再現", "text": "公式の配色、紋章、装備構成をできるだけ正確に再現したいです。"}, {"kind": "likert", "group": "detail", "axis": "公式再現", "text": "公式資料に書かれている設定上の整合性を重視します。"}, {"kind": "likert", "group": "detail", "axis": "自由創作", "text": "公式設定にない部隊、配色、人物を自由に作りたいです。"}, {"kind": "likert", "group": "detail", "axis": "考証拡張", "text": "公式設定を理解した上で、その余白を自分の設定で埋めたいです。"}, {"kind": "likert", "group": "detail", "axis": "即応購入", "text": "気に入ったモデルを見つけたら、使い道を決める前でも確保したくなります。"}, {"kind": "likert", "group": "detail", "axis": "即応購入", "text": "購入を見送った後で入手困難になることを避けたいです。"}, {"kind": "likert", "group": "detail", "axis": "即応購入", "text": "店頭や新製品情報で、予定していなかったモデルと出会うことも楽しみです。"}, {"kind": "likert", "group": "detail", "axis": "計画購入", "text": "次に作る部隊やモデルを決めてから購入したいです。"}, {"kind": "likert", "group": "detail", "axis": "計画購入", "text": "購入する前に、現在持っているモデルと今後必要なモデルを整理します。"}, {"kind": "likert", "group": "detail", "axis": "計画購入", "text": "欲しいモデルでも、制作順や部隊全体の計画に合わなければ見送れます。"}, {"kind": "likert", "group": "detail", "axis": "横断収集", "text": "一つの勢力だけでなく、異なる勢力の特徴的なモデルも手元に置きたいです。"}, {"kind": "likert", "group": "detail", "axis": "一点集中", "text": "複数の勢力へ広げるより、一つの勢力を長く育てたいです。"}, {"kind": "likert", "group": "detail", "axis": "射撃", "text": "敵との距離、射線、遮蔽物を考えながら攻撃することに魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "射撃", "text": "敵が接近する前に、火力を集中して戦力を削る展開が好きです。"}, {"kind": "likert", "group": "detail", "axis": "白兵", "text": "敵との距離を一気に詰め、接近戦へ持ち込む展開に魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "白兵", "text": "指揮官や精鋭同士が直接ぶつかる場面に注目します。"}, {"kind": "likert", "group": "detail", "axis": "物量", "text": "多数の兵が盤面を埋め尽くす光景に魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "物量", "text": "一体ごとの強さより、数と連携によって敵を圧倒する軍団が好きです。"}, {"kind": "likert", "group": "detail", "axis": "精鋭", "text": "多数の一般兵より、少数の精鋭部隊に魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "精鋭", "text": "モデル数が少なくても、一体ずつ明確な役割を持つ軍団を使いたいです。"}, {"kind": "likert", "group": "detail", "axis": "巨大", "text": "巨大兵器や怪物が一体いるだけで、戦場全体の印象が変わることに魅力を感じます。"}, {"kind": "likert", "group": "detail", "axis": "巨大", "text": "多数の小型モデルより、存在感のある大型モデルを作り込みたいです。"}, {"kind": "likert", "group": "detail", "axis": "機動", "text": "正面から攻撃を受け止めるより、素早く移動して戦う場所を選びたいです。"}, {"kind": "likert", "group": "detail", "axis": "耐久", "text": "移動速度より、攻撃を受けても重要地点を守り続けられることを重視します。"}, {"kind": "special", "group": "dark", "axis": "救出", "text": "親と恋人と親友と、完成したばかりのミニチュアが池に落ちました。最初に誰を助けますか？", "options": ["親", "恋人", "親友", "ミニチュア"]}, {"kind": "special", "group": "dark", "axis": "ゼノ", "text": "ゼノに対する基本方針は？", "options": ["根絶する", "利用価値がある間だけ協力する", "警戒しながら共存する", "積極的に交流する", "相手による"]}],K='wh40k-profile-64-v1',A=['世界観','収集','造形','塗装','ゲーム','物語'],labels=['まったく当てはまらない','あまり当てはまらない','どちらともいえない','やや当てはまる','非常に当てはまる'];
let S={step:'intro',name:'',x:'',showX:true,matching:true,i:0,a:{},...load()};function load(){try{return JSON.parse(sessionStorage.getItem(K)||'{}')}catch{return{}}}function save(){sessionStorage.setItem(K,JSON.stringify(S))}const app=document.querySelector('#app');function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function go(x){S.step=x;save();render()}
function basicScores(){let out={};A.forEach(x=>out[x]=0);Q.slice(0,24).forEach((q,i)=>out[q.axis]+=S.a[i]||1);let forced=[0,0,0,0,0,0];Q.slice(24,30).forEach((q,j)=>{let v=S.a[j+24];if(v)forced[v-1]++});return A.map((x,i)=>Math.round((((out[x]-4)/16)*.75+(forced[i]/6)*.25)*100))}
function avg(axis){let arr=Q.map((q,i)=>q.axis===axis&&typeof S.a[i]==='number'?S.a[i]:null).filter(v=>v!==null);return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}function type(){let sc=basicScores(),o=A.map((x,i)=>[x,sc[i]]).sort((a,b)=>b[1]-a[1]),m={'世界観|物語':'銀河年代記官','世界観|収集':'帝国博物卿','世界観|造形':'遺物復元官','世界観|塗装':'彩色文献官','世界観|ゲーム':'戦域司令官','収集|造形':'兵器蒐集技官','収集|塗装':'戦団キュレーター','収集|ゲーム':'戦力編成官','収集|物語':'銀河蒐集記録官','造形|塗装':'工匠技術官','造形|ゲーム':'野戦工兵長','造形|物語':'設定具現化師','塗装|ゲーム':'儀仗戦闘官','塗装|物語':'戦史彩色官','ゲーム|物語':'戦役記録官'};if(Math.max(...sc)-Math.min(...sc)<=15)return'万象趣味人';let t=o.slice(0,2).map(x=>x[0]),key=Object.keys(m).find(k=>k.split('|').every(x=>t.includes(x)));return m[key]||'独立遊撃趣味人'}
function tags(){let t=[];let casual=avg('カジュアル'),comp=avg('競技'),research=avg('研究'),nar=avg('ナラティブ');if(comp>=4)t.push('コンペティティブ型');else if(nar>=4)t.push('ナラティブ型');else if(research>=4)t.push('研究型カジュアル');else if(casual>=3.5)t.push('交流型カジュアル');if(avg('公式再現')>=3.5&&avg('自由創作')>=3.5)t.push('考証拡張型');else if(avg('公式再現')>=3.5)t.push('正史再現型');else if(avg('自由創作')>=3.5)t.push('自由創作型');let fast=avg('即応購入'),plan=avg('計画購入'),cross=avg('横断収集'),focus=avg('一点集中');if(fast>=3.7)t.push('即応調達型');if(plan>=3.7)t.push('計画補給型');if(cross>=4&&focus>=4)t.push('主力固定・遊撃収集型');else if(focus>=4)t.push('一極集中育成型');else if(cross>=4)t.push('銀河横断収集型');[['射撃','遠距離火力型'],['白兵','突撃白兵型'],['物量','人海戦術型'],['精鋭','少数精鋭型'],['巨大','巨神投入型'],['機動','高機動型'],['耐久','戦線維持型']].forEach(([a,b])=>{if(avg(a)>=4)t.push(b)});return t.slice(0,8)}function dark(){let rescue=S.a[62],xeno=S.a[63];return {rescue:['','血統護持','盟約優先','戦友救出','聖遺物保全'][rescue]||'未回答',xeno:['','ゼノ根絶派','実利外交派','限定共存派','銀河交流派','個別審査派'][xeno]||'未回答'}}
function render(){if(S.step==='intro'){app.innerHTML=`<section class="card"><div class="eyebrow">64の問いで楽しみ方を可視化</div><h2>あなたは暗黒の遠未来を<br>どう楽しむか。</h2><p>基本6軸、ゲーム温度、創作姿勢、購入傾向、戦闘美学を診断し、SNS共有用画像を作ります。キノコ関連設問は含みません。</p><button class="primary" onclick="go('profile')">診断を始める</button><p class="small">入力内容はブラウザのセッション内だけに保存されます。</p></section>`;return}if(S.step==='profile'){app.innerHTML=`<section class="card"><div class="eyebrow">PROFILE</div><h3>画像に載せる情報</h3><div class="field">表示名<input type="text" maxlength="20" value="${esc(S.name)}" oninput="S.name=this.value;save()"></div><div class="field">Xアカウント名（任意）<input type="text" value="${esc(S.x)}" oninput="S.x=this.value;save()" placeholder="@account"></div><label class="check"><input type="checkbox" ${S.showX?'checked':''} onchange="S.showX=this.checked;save()">Xアカウント名を画像に載せる</label><label class="check"><input type="checkbox" ${S.matching?'checked':''} onchange="S.matching=this.checked;save()">同好の人を探していますと表示する</label><div class="row"><button onclick="go('intro')">戻る</button><button class="primary" onclick="go('quiz')">質問へ進む</button></div></section>`;return}if(S.step==='quiz'){let q=Q[S.i],opts=q.kind==='likert'?labels:q.options;app.innerHTML=`<section class="card"><div class="row"><b>QUESTION ${S.i+1} / ${Q.length}</b><span>${S.i<30?'基本診断':S.i<62?'詳細プロフィール':'暗黒の遠未来における重要事項'}</span></div><div class="progress"><i style="width:${(S.i+1)/Q.length*100}%"></i></div><h3>${q.text}</h3>${opts.map((x,i)=>`<button class="choice ${S.a[S.i]===i+1?'selected':''}" onclick="answer(${i+1})">${i+1}　${x}</button>`).join('')}<div class="row"><button ${S.i?'':'disabled'} onclick="S.i=Math.max(0,S.i-1);save();render()">前へ</button>${S.i===29?'<button onclick="go(&quot;basicResult&quot;)">基本結果を見る</button>':''}</div></section>`;return}if(S.step==='basicResult'){showResult(false);return}showResult(true)}
function answer(v){S.a[S.i]=v;if(S.i<Q.length-1)S.i++;else S.step='result';save();render()}function showResult(full){let sc=basicScores(),d=dark(),ts=full?tags():[];app.innerHTML=`<div class="grid"><section class="card"><div class="eyebrow">YOUR TYPE</div><h2>${type()}</h2><canvas id="chart" width="1080" height="1080"></canvas><div class="scores">${A.map((x,i)=>`<div class="score">${x}<b>${sc[i]}</b></div>`).join('')}</div>${full?`<div class="section"><h3>スタイル</h3><div class="tags">${ts.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="tag">中間・複合型</span>'}</div><h3>暗黒の遠未来における見解</h3><p>救出優先：${d.rescue}<br>ゼノ方針：${d.xeno}</p></div>`:''}</section><section class="card"><h3>シェア用画像</h3><canvas id="share" width="1080" height="1080"></canvas><p class="small">名前、Xアカウント、回答、画像はサーバーへ送信しません。</p><button class="primary choice" onclick="downloadImage()">PNGを保存</button><button class="choice" onclick="copyText()">投稿文をコピー</button><button class="choice" onclick="openX()">Xの投稿画面を開く</button>${!full?'<button class="choice" onclick="S.i=30;go(&quot;quiz&quot;)">詳細プロフィールへ進む</button>':''}<button class="choice" onclick="resetAll()">診断データを削除</button></section></div>`;draw(document.querySelector('#chart'),sc,false,full);draw(document.querySelector('#share'),sc,true,full)}
function draw(c,sc,share,full){let x=c.getContext('2d'),cx=540,cy=465,R=255;x.fillStyle='#0b1120';x.fillRect(0,0,1080,1080);x.textAlign='center';x.fillStyle='#f59e0b';x.font='700 28px sans-serif';x.fillText('WH40K HOBBY PROFILE',540,65);x.fillStyle='#fff';x.font='900 58px sans-serif';x.fillText(type(),540,140);let pt=(i,r)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/3)*r,cy+Math.sin(-Math.PI/2+i*Math.PI/3)*r];for(let g=1;g<=5;g++){x.beginPath();A.forEach((_,i)=>{let p=pt(i,R*g/5);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.strokeStyle='#64748b88';x.stroke()}x.beginPath();sc.forEach((v,i)=>{let p=pt(i,R*v/100);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.fillStyle='#f59e0b55';x.fill();x.strokeStyle='#f59e0b';x.lineWidth=7;x.stroke();x.font='700 27px sans-serif';A.forEach((a,i)=>{let p=pt(i,R+55);x.fillStyle='#e2e8f0';x.fillText(a+' '+sc[i],p[0],p[1])});if(full){x.fillStyle='#f8fafc';x.font='700 25px sans-serif';tags().slice(0,4).forEach((t,i)=>x.fillText(t,540,790+i*34));let d=dark();x.fillStyle='#cbd5e1';x.font='23px sans-serif';x.fillText('救出優先：'+d.rescue+'　ゼノ方針：'+d.xeno,540,940)}if(share){x.fillStyle='#cbd5e1';x.font='700 26px sans-serif';x.fillText((S.name||'名もなき趣味人')+(S.showX&&S.x?'  '+S.x:''),540,990);x.fillStyle='#f59e0b';x.font='22px sans-serif';x.fillText('#WH40K趣味傾向診断'+(S.matching?'  #同好の人を探しています':''),540,1030)}}function postText(){return`${S.name||'名もなき趣味人'}のWH40K趣味傾向診断は「${type()}」でした。
${tags().join(' / ')}
#WH40K趣味傾向診断`}function downloadImage(){let a=document.createElement('a');a.download='wh40k-hobby-profile.png';a.href=document.querySelector('#share').toDataURL('image/png');a.click()}function copyText(){navigator.clipboard.writeText(postText()).then(()=>alert('コピーしました'))}function openX(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(postText()),'_blank','noopener')}function resetAll(){sessionStorage.removeItem(K);location.reload()}render();
</script></body></html>
