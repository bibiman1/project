<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WH40K ホビー傾向診断</title><style>
:root{--bg:#070b12;--card:#111827;--line:#475569;--gold:#f59e0b;--text:#f8fafc;--muted:#a8b2c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b1907,var(--bg) 42%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:960px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #7c4a183f;padding:0 0 16px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.22em}.privacy{color:#86efac;font-size:12px}.card{background:#111827e8;border:1px solid #334155;border-radius:24px;padding:30px;margin-top:28px;box-shadow:0 20px 50px #0006}h1{font-size:22px}h2{font-size:clamp(34px,7vw,64px);line-height:1.15;margin:20px 0}p{color:var(--muted);line-height:1.9}.btn,button{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#111}.ghost{background:#1e293b;color:#fff}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}input{width:100%;padding:14px;border-radius:12px;border:1px solid #475569;background:#020617;color:#fff;font-size:16px}.field{margin:18px 0}.choice{display:flex;width:100%;margin:10px 0;text-align:left;background:#020617;color:#fff;border:1px solid #475569}.choice:hover,.selected{border-color:var(--gold);background:#3a260d}.progress{height:8px;background:#1e293b;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}.row{display:flex;gap:12px;justify-content:space-between;align-items:center}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score{padding:10px;text-align:center;background:#020617;border-radius:12px}.score b{color:var(--gold);font-size:22px}canvas{width:100%;max-width:540px;display:block;margin:18px auto;border-radius:18px}.hidden{display:none}.check{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid #475569;border-radius:12px;margin:12px 0}.check input{width:auto}.small{font-size:12px}@media(max-width:700px){.two{grid-template-columns:1fr}.wrap{padding:16px}.card{padding:20px}.head h1{font-size:17px}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">HOBBY PROFILE</div><h1>WH40K 趣味傾向診断</h1></div><div class="privacy">サーバー保存なし</div></header><section id="app"></section></main><script>
const K='wh40k-hobby-profile-v1',axes=['世界観','収集','造形','塗装','対戦','物語'];
const qs=[['世界観','ミニチュアの強さより、その勢力がどのような歴史や思想を持っているかが気になります。'],['世界観','知らない人物名、戦争、惑星などが出てくると、その背景を調べたくなります。'],['世界観','同じ出来事が、勢力ごとに異なる意味で語られている設定に面白さを感じます。'],['世界観','ゲームをしなくても、勢力相関図や銀河の歴史を読んでいるだけで楽しめます。'],['収集','同じ勢力やテーマのミニチュアを、まとまりのあるコレクションとしてそろえたいです。'],['収集','ゲームで使わなくても、見た目が気に入ったミニチュアなら欲しくなります。'],['収集','限定品、旧モデル、珍しいモデルに魅力を感じます。'],['収集','完成したミニチュアを棚やケースに並べ、眺めること自体を楽しみたいです。'],['造形','説明書どおりだけでなく、ポーズや装備を変更してみたいです。'],['造形','複数の部品を組み合わせ、自分だけの兵士や指揮官を作ることに興味があります。'],['造形','ミニチュア本体だけでなく、台座、廃墟、地形なども作ってみたいです。'],['造形','完成度よりも、試行錯誤しながら手を動かして形にする工程を楽しめそうです。'],['塗装','どのような配色にするかを考える時間も楽しみの一部だと思います。'],['塗装','陰影、金属、汚れ、傷などの塗装技法を少しずつ習得したいです。'],['塗装','同じ造形でも、塗り方によって個性が変わることに魅力を感じます。'],['塗装','時間がかかっても、納得できる仕上がりになるまで塗り込みたいです。'],['対戦','自分で考えた編成や作戦が、実際にどこまで通用するか試したいです。'],['対戦','勝敗だけでなく、相手との読み合いや盤面上の判断を楽しみたいです。'],['対戦','対戦後に配置や行動を振り返り、次の戦いで改善したいです。'],['対戦','新しい相手や異なる勢力と、繰り返しゲームをしてみたいです。'],['物語','自分の部隊に、名前、出身地、目的などの設定を付けたいです。'],['物語','対戦の結果を、その部隊の戦歴として残したいです。'],['物語','勝敗よりも、印象的な人物の活躍や予想外の出来事を覚えていたいです。'],['物語','複数回の対戦をつなぎ、部隊が成長したり損害を受けたりする物語を作りたいです。']];
const names={'世界観|物語':['銀河年代記官','設定を読み解き、自分だけの戦史へ発展させる人です。'],'世界観|収集':['帝国博物卿','背景設定に基づき、意味のあるコレクションを築く人です。'],'世界観|造形':['遺物復元官','世界設定を立体物として具現化する人です。'],'世界観|塗装':['彩色文献官','色や紋章の背景まで読み込み、塗装で再現する人です。'],'世界観|対戦':['戦域司令官','原作世界の戦いを、盤上の判断で再現する人です。'],'収集|造形':['兵器蒐集技官','集めたモデルを、自分だけの仕様へ作り変える人です。'],'収集|塗装':['戦団キュレーター','統一感のある、美しい展示軍団を育てる人です。'],'収集|対戦':['戦力編成官','実戦で機能する軍団を計画的にそろえる人です。'],'収集|物語':['銀河蒐集記録官','一体ごとの由来を大切にし、軍団を記録する人です。'],'造形|塗装':['工匠技術官','工作と彩色の両面から、作品の完成度を高める人です。'],'造形|対戦':['野戦工兵長','盤上で映え、実際に戦える改造部隊を作る人です。'],'造形|物語':['設定具現化師','頭の中の人物や出来事を、造形として現す人です。'],'塗装|対戦':['儀仗戦闘官','美しく仕上げた軍団を、実戦へ送り出す人です。'],'塗装|物語':['戦史彩色官','傷や色彩を使い、モデルに戦歴を刻む人です。'],'対戦|物語':['戦役記録官','対戦結果を物語へ変え、継続する戦役を楽しむ人です。']};
let s={step:'intro',name:'',x:'',showX:true,matching:true,a:{},q:0,...JSON.parse(sessionStorage.getItem(K)||'{}')};const app=document.querySelector('#app');function save(){sessionStorage.setItem(K,JSON.stringify(s))}function scores(){return axes.map(x=>{let v=qs.map((q,i)=>q[0]===x?(s.a[i]||1):0).filter(Boolean).reduce((a,b)=>a+b,0);return Math.round((v-4)/16*100)})}function result(){let sc=scores(),ord=axes.map((x,i)=>[x,sc[i]]).sort((a,b)=>b[1]-a[1]);if(Math.max(...sc)-Math.min(...sc)<=15)return['万象趣味人','世界観から対戦まで、WH40Kの複数要素を横断して楽しむ人です。'];let top=ord.slice(0,2).map(x=>x[0]);let k=Object.keys(names).find(k=>k.split('|').every(x=>top.includes(x)));return names[k]||['独立遊撃趣味人','自分の比重でWH40Kを楽しむ人です。']}function go(x){s.step=x;save();render()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(s.step==='intro')app.innerHTML=`<div class="card"><div class="eyebrow">24の問いで、楽しみ方を可視化</div><h2>あなたは暗黒の遠未来を<br>どう楽しむか。</h2><p>世界観・収集・造形・塗装・対戦・物語。6つの比重をレーダーチャートにし、共有できる画像を作ります。</p><button class="primary" onclick="go('profile')">診断を始める</button><p class="small">入力内容と結果はブラウザ内でのみ処理します。</p></div>`;else if(s.step==='profile')app.innerHTML=`<div class="card"><div class="eyebrow">PROFILE</div><h3>画像に載せる情報</h3><div class="field">表示名<input maxlength="20" value="${esc(s.name)}" oninput="s.name=this.value;save()" placeholder="名もなき趣味人"></div><div class="field">Xアカウント名（任意）<input value="${esc(s.x)}" oninput="s.x=this.value;save()" placeholder="@account"></div><label class="check"><input type="checkbox" ${s.showX?'checked':''} onchange="s.showX=this.checked;save()">Xアカウント名を画像に載せる</label><label class="check"><input type="checkbox" ${s.matching?'checked':''} onchange="s.matching=this.checked;save()">同好の人を探していますと表示する</label><p class="small">SNS投稿時、画像に含めた情報は公開されます。</p><div class="row"><button class="ghost" onclick="go('intro')">戻る</button><button class="primary" onclick="go('quiz')">質問へ進む</button></div></div>`;else if(s.step==='quiz'){let q=qs[s.q];app.innerHTML=`<div class="card"><div class="row"><b>QUESTION ${s.q+1} / 24</b><span>${q[0]}</span></div><div class="progress"><i style="width:${(s.q+1)/24*100}%"></i></div><h3>${q[1]}</h3>${['まったく当てはまらない','あまり当てはまらない','どちらともいえない','やや当てはまる','非常に当てはまる'].map((x,i)=>`<button class="choice ${s.a[s.q]==i+1?'selected':''}" onclick="ans(${i+1})">${i+1}　${x}</button>`).join('')}<button class="ghost" ${s.q?'':'disabled'} onclick="s.q--;save();render()">前へ</button></div>`}else showResult()}
function ans(v){s.a[s.q]=v;if(s.q<23)s.q++;else s.step='result';save();render()}function showResult(){let sc=scores(),r=result();app.innerHTML=`<div class="grid two"><div class="card"><div class="eyebrow">YOUR TYPE</div><h2>${r[0]}</h2><p>${r[1]}</p><canvas id="radar" width="1080" height="1080"></canvas><div class="scores">${axes.map((x,i)=>`<div class="score">${x}<br><b>${sc[i]}</b></div>`).join('')}</div></div><div class="card"><h3>シェア用画像</h3><canvas id="share" width="1080" height="1080"></canvas><div class="grid"><button class="primary" onclick="download()">PNGを保存</button><button class="ghost" onclick="copyText()">投稿文をコピー</button><button class="ghost" onclick="openX()">Xの投稿画面を開く</button><button class="ghost" onclick="resetAll()">診断データを削除</button></div><p class="small">保存したPNGは投稿時に添付してください。</p></div></div>`;draw(document.querySelector('#radar'),sc,r,false);draw(document.querySelector('#share'),sc,r,true)}
function draw(c,sc,r,share){let x=c.getContext('2d'),W=1080,cx=540,cy=500,R=270;x.fillStyle='#0b1120';x.fillRect(0,0,W,W);x.textAlign='center';x.fillStyle='#f59e0b';x.font='700 30px sans-serif';x.fillText('WH40K HOBBY PROFILE',540,80);x.fillStyle='#fff';x.font='900 58px sans-serif';x.fillText(r[0],540,155);let pt=(i,z)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/3)*z,cy+Math.sin(-Math.PI/2+i*Math.PI/3)*z];for(let g=1;g<=5;g++){x.beginPath();axes.forEach((_,i)=>{let p=pt(i,R*g/5);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.strokeStyle='#64748b88';x.stroke()}x.beginPath();sc.forEach((v,i)=>{let p=pt(i,R*v/100);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.fillStyle='#f59e0b55';x.fill();x.strokeStyle='#f59e0b';x.lineWidth=7;x.stroke();x.font='700 28px sans-serif';axes.forEach((a,i)=>{let p=pt(i,R+55);x.fillStyle='#e2e8f0';x.fillText(a+' '+sc[i],p[0],p[1])});x.fillStyle='#fff';x.font='700 30px sans-serif';x.fillText(r[1],540,840);if(share){x.fillStyle='#cbd5e1';x.font='700 28px sans-serif';x.fillText((s.name||'名もなき趣味人')+(s.showX&&s.x?'  '+s.x:''),540,925);x.fillStyle='#f59e0b';x.font='700 24px sans-serif';x.fillText('#WH40K趣味傾向診断  #'+r[0]+(s.matching?'  #同好の人を探しています':''),540,985)}}function text(){let r=result();return`${s.name||'名もなき趣味人'}のWH40K趣味傾向診断は「${r[0]}」でした。\n\n${axes.map((x,i)=>x+'：'+scores()[i]).join(' / ')}\n\n${s.matching?'同じ楽しみ方の人を探しています。\n':''}#WH40K趣味傾向診断 #${r[0]}`}function download(){let a=document.createElement('a');a.download='wh40k-hobby-profile.png';a.href=document.querySelector('#share').toDataURL();a.click()}function copyText(){navigator.clipboard.writeText(text()).then(()=>alert('コピーしました'))}function openX(){open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text()),'_blank')}function resetAll(){sessionStorage.removeItem(K);location.reload()}render();
</script></body></html>
